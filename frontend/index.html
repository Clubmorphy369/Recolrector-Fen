<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess PDF to FEN</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; background: #f8f9fa; }
        h1 { color: #2c3e50; }
        .upload-area { border: 2px dashed #3498db; padding: 2rem; text-align: center; border-radius: 8px; background: white; }
        input[type="file"] { margin: 1rem 0; }
        .pages-input { margin: 1rem 0; }
        .pages-input label { font-weight: bold; }
        .pages-input input { padding: 0.5rem; width: 200px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #3498db; color: white; border: none; padding: 0.5rem 2rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2980b9; }
        .info { font-size: 0.9rem; color: #555; margin-top: 0.5rem; }
        #status { margin-top: 1rem; font-weight: bold; }
        #preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 1rem; justify-content: center; }
        #preview img { max-width: 120px; max-height: 120px; border-radius: 6px; border: 1px solid #ddd; object-fit: cover; }
        #result { margin-top: 2rem; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 0.6rem 0.8rem; text-align: left; }
        th { background: #f2f2f2; position: sticky; top: 0; }
        .error { color: #e74c3c; }
        .success { color: #27ae60; }
        .fen-cell { font-family: 'Courier New', monospace; font-size: 0.8rem; word-break: break-all; }
        .btn-copy { background: #2ecc71; color: white; border: none; padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-copy:hover { background: #27ae60; }
        .btn-copy.used { background: #95a5a6; cursor: not-allowed; }
        .badge-duplicate { background: #f39c12; color: white; padding: 0.2rem 0.5rem; border-radius: 12px; font-size: 0.7rem; margin-left: 0.5rem; }
        .duplicate-row { background: #fff8e1; }
        .stats { margin-top: 1rem; font-size: 0.95rem; color: #333; }
    </style>
</head>
<body>
    <h1>♟️ Chess PDF to FEN</h1>
    <p>Sube imágenes o PDFs con tableros de ajedrez.</p>
    <div class="upload-area">
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" id="fileInput" name="files" accept="image/*, application/pdf" multiple required>
            <div class="pages-input">
                <label for="pages">Páginas (solo PDF, separadas por comas):</label>
                <input type="text" id="pages" name="pages" placeholder="ej: 1,3,5" value="1">
            </div>
            <button type="submit">Procesar archivos</button>
        </form>
        <div class="info">📄 PDF: máximo 3 archivos y 3 páginas por archivo.<br>🖼️ Imágenes: máximo 10 archivos.</div>
        <div id="preview"></div>
    </div>
    <div id="status" class="status"></div>
    <div id="result"></div>

    <script>
        // ---------- VISTA PREVIA DE IMÁGENES ----------
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const previewDiv = document.getElementById('preview');
            previewDiv.innerHTML = '';
            const files = e.target.files;
            if (!files.length) return;
            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = document.createElement('img');
                    img.src = ev.target.result;
                    img.alt = file.name;
                    img.title = file.name;
                    previewDiv.appendChild(img);
                };
                reader.readAsDataURL(file);
            }
        });

        // ---------- SUBIDA Y PROCESAMIENTO ----------
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            const fileInput = document.getElementById('fileInput');
            const files = fileInput.files;
            if (files.length === 0) {
                alert('Selecciona al menos un archivo.');
                return;
            }
            for (const file of files) {
                formData.append('files', file);
            }
            const pagesInput = document.getElementById('pages');
            formData.append('pages', pagesInput.value);

            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            statusDiv.textContent = 'Procesando... (puede tomar varios segundos)';
            resultDiv.innerHTML = '';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                statusDiv.textContent = 'Procesamiento completado.';

                if (data.success && data.results) {
                    // ---------- FILTRAR DUPLICADOS ----------
                    const uniqueResults = [];
                    const seenFens = new Set();
                    for (const item of data.results) {
                        const fen = item.fen || null;
                        // Si es error o ya vimos este FEN, lo omitimos
                        if (!fen || seenFens.has(fen)) continue;
                        seenFens.add(fen);
                        uniqueResults.push(item);
                    }

                    // ---------- CONSTRUIR TABLA ----------
                    let html = '<h3>Resultados</h3>';
                    if (uniqueResults.length === 0) {
                        html += '<p>No se obtuvieron FEN válidos.</p>';
                    } else {
                        html += `<table><thead><tr>
                            <th>Archivo</th>
                            <th>Página</th>
                            <th>Tablero</th>
                            <th>FEN</th>
                            <th>Acción</th>
                        </tr></thead><tbody>`;
                        for (const item of uniqueResults) {
                            const page = item.page || '-';
                            const board = item.board || '-';
                            const fen = item.fen || 'Error';
                            const isError = !item.fen;
                            html += `<tr data-fen="${fen}">
                                <td>${item.file}</td>
                                <td>${page}</td>
                                <td>${board}</td>
                                <td class="${isError ? 'error' : 'success'} fen-cell">${fen}</td>
                                <td>
                                    <button class="btn-copy" data-fen="${fen}" ${isError ? 'disabled' : ''}>
                                        ${isError ? 'Error' : '📋 Copiar y eliminar'}
                                    </button>
                                </td>
                            </tr>`;
                        }
                        html += '</tbody></table>';
                        // Estadísticas
                        const total = data.results.length;
                        const uniqueCount = uniqueResults.length;
                        const duplicates = total - uniqueCount;
                        html += `<div class="stats">Total FEN obtenidos: ${total} | FEN únicos: ${uniqueCount} | Duplicados eliminados: ${duplicates}</div>`;
                    }
                    resultDiv.innerHTML = html;

                    // ---------- FUNCIONALIDAD COPIAR Y ELIMINAR ----------
                    document.querySelectorAll('.btn-copy').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const fen = this.getAttribute('data-fen');
                            if (!fen || this.disabled) return;
                            // Copiar al portapapeles
                            navigator.clipboard.writeText(fen).then(() => {
                                // Eliminar la fila de la tabla
                                const row = this.closest('tr');
                                if (row) {
                                    row.style.transition = 'all 0.3s';
                                    row.style.opacity = '0';
                                    setTimeout(() => {
                                        row.remove();
                                        // Actualizar estadísticas
                                        updateStats();
                                    }, 300);
                                }
                            }).catch(err => {
                                alert('Error al copiar: ' + err);
                            });
                        });
                    });

                    // Actualizar estadísticas después de eliminar filas
                    function updateStats() {
                        const rows = document.querySelectorAll('#result table tbody tr');
                        const total = rows.length;
                        const statsDiv = document.querySelector('.stats');
                        if (statsDiv) {
                            statsDiv.textContent = `FEN restantes: ${total}`;
                        }
                    }

                } else {
                    resultDiv.innerHTML = `<p class="error">Error: ${data.error || 'Respuesta inesperada'}</p>`;
                }
            } catch (error) {
                statusDiv.textContent = 'Error';
                resultDiv.innerHTML = `<p class="error">Error de red: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
