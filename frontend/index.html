<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess PDF to FEN</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        h1 { color: #2c3e50; }
        .upload-area { border: 2px dashed #3498db; padding: 2rem; text-align: center; border-radius: 8px; }
        input[type="file"] { margin: 1rem 0; }
        .pages-input { margin: 1rem 0; }
        .pages-input label { font-weight: bold; }
        .pages-input input { padding: 0.5rem; width: 200px; }
        button { background: #3498db; color: white; border: none; padding: 0.5rem 2rem; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2980b9; }
        #result { margin-top: 2rem; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
        th { background: #f2f2f2; }
        .error { color: #e74c3c; }
        .success { color: #27ae60; }
        .status { margin-top: 1rem; font-weight: bold; }
        .fen-cell { font-family: monospace; font-size: 0.8rem; word-break: break-all; }
        .info { font-size: 0.9rem; color: #555; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <h1>♟️ Chess PDF to FEN</h1>
    <p>Sube imágenes o PDFs con tableros de ajedrez.</p>
    <div class="upload-area">
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" id="fileInput" name="files" accept="image/*, application/pdf" multiple required>
            <div class="pages-input">
                <label for="pages">Páginas (solo PDF, separadas por comas):</label>
                <input type="text" id="pages" name="pages" placeholder="ej: 1,3,5" value="1">
            </div>
            <button type="submit">Procesar archivos</button>
        </form>
        <div class="info">📄 PDF: máximo 3 archivos y 3 páginas por archivo.<br>
        🖼️ Imágenes: máximo 10 archivos.</div>
    </div>
    <div id="status" class="status"></div>
    <div id="result"></div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            const fileInput = document.getElementById('fileInput');
            const files = fileInput.files;
            if (files.length === 0) {
                alert('Selecciona al menos un archivo.');
                return;
            }
            for (const file of files) {
                formData.append('files', file);
            }
            const pagesInput = document.getElementById('pages');
            formData.append('pages', pagesInput.value);

            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            statusDiv.textContent = 'Procesando... (puede tomar varios segundos)';
            resultDiv.innerHTML = '';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                statusDiv.textContent = 'Procesamiento completado.';

                if (data.success && data.results) {
                    let html = '<h3>Resultados</h3><table><thead><tr>' +
                        '<th>Archivo</th><th>Página</th><th>Tablero</th><th>FEN / Error</th>' +
                        '</tr></thead><tbody>';
                    let successCount = 0;
                    for (const item of data.results) {
                        const fen = item.fen || item.error || 'Error';
                        const isError = !item.fen;
                        const page = item.page || '-';
                        const board = item.board || '-';
                        html += `<tr>
                            <td>${item.file}</td>
                            <td>${page}</td>
                            <td>${board}</td>
                            <td class="${isError ? 'error' : 'success'} fen-cell">${fen}</td>
                        </tr>`;
                        if (item.fen) successCount++;
                    }
                    html += '</tbody></table>';
                    html += `<p>Procesados: ${data.results.length}, FEN obtenidos: ${successCount}</p>`;
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `<p class="error">Error: ${data.error || 'Respuesta inesperada'}</p>`;
                }
            } catch (error) {
                statusDiv.textContent = 'Error';
                resultDiv.innerHTML = `<p class="error">Error de red: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
